# PR preview — every non-draft PR gets a Cloudflare preview URL.
#
# Builds with CLOUDFLARE_ENV=staging (same Worker as staging), then
# `wrangler versions upload` uploads the build as a new version of the
# staging Worker WITHOUT deploying it — no traffic is shifted, staging and
# production keep serving their current versions. Each push gets a fresh
# per-version URL:
#   https://<version-id>-masrexach-staging.<account-subdomain>.workers.dev
# plus a stable per-PR alias URL (via --preview-alias):
#   https://pr-<number>-masrexach-staging.<account-subdomain>.workers.dev
# Previews run with the staging Worker's existing vars/secrets. If the staging
# Worker does not exist yet, this workflow bootstraps it with a one-time
# deploy before returning to version uploads on later pushes.
# Dependabot PRs are skipped (GitHub withholds Actions secrets from Dependabot
# runs, so wrangler could not authenticate); a maintainer re-run produces a
# preview.

name: Deploy (preview)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "astro.config.*"
      - "*.config.*"
      - "wrangler.*"
      - ".nvmrc"
      - ".npmrc"
      - ".github/workflows/deploy-preview.yml"

permissions:
  contents: read

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-validation:
    uses: ./.github/workflows/release-validation.yml
    with:
      check_name: Preview release validation

  preview:
    needs: release-validation
    name: Cloudflare preview version
    runs-on: ubuntu-latest
    # Dependabot-triggered runs receive no Actions secrets (repo- or
    # environment-level — GitHub treats dependency bumps as untrusted code),
    # so wrangler could not authenticate. Skip. A maintainer re-running the
    # failed run gets a preview, because the re-run executes under the
    # maintainer's identity.
    if: needs.release-validation.outputs.is_release != 'true' && github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'
    environment: preview
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install social-card renderer browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build (staging)
        run: pnpm build
        env:
          CLOUDFLARE_ENV: staging
          PUBLIC_BUILD_TYPE: ${{ vars.PUBLIC_BUILD_TYPE }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}

      # `versions upload` requires the staging Worker to exist. Before the
      # first merge to main (which deploys staging), fall back to a full
      # deploy to bootstrap the Worker; its workers.dev URL serves this PR's
      # build until a real staging deploy takes over.
      - name: Upload preview version
        id: upload
        run: |
          set -euo pipefail
          if ! pnpm exec wrangler versions upload \
              --config dist/server/wrangler.json \
              --keep-vars \
              --preview-alias "pr-${{ github.event.pull_request.number }}" \
              --message "PR #${{ github.event.pull_request.number }} (${{ github.event.pull_request.head.sha }})" \
              2>&1 | tee /tmp/wrangler-upload.log; then
            if ! grep -q "Worker that does not yet exist" /tmp/wrangler-upload.log; then
              cat /tmp/wrangler-upload.log >&2
              exit 1
            fi
            echo "::notice::Staging Worker does not exist yet — bootstrapping it with a deploy."
            pnpm exec wrangler deploy --config dist/server/wrangler.json 2>&1 | tee /tmp/wrangler-deploy.log
            deployed_url=$(grep -oE "https://[a-zA-Z0-9.-]+workers\.dev" /tmp/wrangler-deploy.log | head -1 || true)
            if [ -z "$deployed_url" ]; then
              echo "Could not parse deployed URL from wrangler output:" >&2
              cat /tmp/wrangler-deploy.log >&2
              exit 1
            fi
            echo "preview-version-url=$deployed_url" >> "$GITHUB_OUTPUT"
            echo "preview-alias-url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version_url=$(grep -m1 "Version Preview URL:" /tmp/wrangler-upload.log | grep -oE "https://[a-zA-Z0-9.-]+workers\.dev" || true)
          alias_url=$(grep -m1 "Version Preview Alias URL:" /tmp/wrangler-upload.log | grep -oE "https://[a-zA-Z0-9.-]+workers\.dev" || true)
          if [ -z "$version_url" ] && [ -z "$alias_url" ]; then
            echo "Could not parse preview URL from wrangler output:" >&2
            cat /tmp/wrangler-upload.log >&2
            exit 1
          fi
          echo "preview-version-url=$version_url" >> "$GITHUB_OUTPUT"
          echo "preview-alias-url=$alias_url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment preview URL on PR
        uses: actions/github-script@v9
        env:
          PREVIEW_VERSION_URL: ${{ steps.upload.outputs.preview-version-url }}
          PREVIEW_ALIAS_URL: ${{ steps.upload.outputs.preview-alias-url }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = "<!-- cloudflare-preview-url -->";
            const versionUrl = process.env.PREVIEW_VERSION_URL;
            const aliasUrl = process.env.PREVIEW_ALIAS_URL;
            const sha = process.env.PR_SHA;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const lines = [
              marker,
              "## Cloudflare preview",
              "",
            ];
            if (aliasUrl) {
              lines.push(`Stable URL for this PR: ${aliasUrl}`, "");
            }
            if (versionUrl) {
              lines.push(`URL for this push (\`${sha.slice(0, 7)}\`): ${versionUrl}`, "");
            }
            lines.push(
              `[Workflow run](${runUrl})`,
              "",
              "Served from the staging Worker — production traffic is not affected. The contact form uses the staging secrets.",
            );
            const body = lines.join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
