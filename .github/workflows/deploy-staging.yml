# Staging deploy — every merge to main (push to main), plus manual runs.
#
# CLOUDFLARE_ENV=staging makes the Astro adapter resolve env.staging of
# wrangler.jsonc into the deploy config: Worker `masrexach-staging` on
# masrexach-staging.marctonimas.com. workers.dev stays on for this Worker
# because PR preview URLs (deploy-preview.yml) are served from its versions.
# This is also the deploy that bootstraps the staging Worker, its SESSION KV
# namespace, vars and secrets — previews depend on it existing.

name: Deploy (staging)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy (staging)
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install social-card renderer browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build (staging)
        run: pnpm build
        env:
          CLOUDFLARE_ENV: staging
          PUBLIC_BUILD_TYPE: ${{ vars.PUBLIC_BUILD_TYPE }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}

      - name: Deploy Worker
        run: ./scripts/deploy.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VARS_CONTEXT: ${{ toJSON(vars) }}
          SECRETS_CONTEXT: ${{ toJSON(secrets) }}

      # deploy.sh uploads the managed secrets with the deploy; this only deletes
      # managed secrets that were removed from GitHub (no write otherwise).
      - name: Remove stale secrets
        run: ./scripts/sync-secrets.sh --prune
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SECRETS_CONTEXT: ${{ toJSON(secrets) }}

      # Non-blocking: on the very first deploy the custom-domain certificate
      # can still be provisioning when this runs; later deploys are immediate.
      - name: Smoke test
        run: node scripts/smoke.mjs https://masrexach-staging.marctonimas.com "$GITHUB_SHA"
        continue-on-error: true
