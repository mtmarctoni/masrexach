name: Lighthouse

on:
  pull_request:
    paths:
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "src/**"
      # License notices do not change the rendered site; font binaries still do.
      - "!src/assets/fonts/OFL.txt"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "astro.config.*"
      - "*.config.*"
      - ".nvmrc"
      - ".npmrc"
      - ".lighthouserc.json"
      - "lighthouse-routine.cjs"
      - ".github/workflows/lighthouse.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-validation:
    uses: ./.github/workflows/release-validation.yml
    with:
      check_name: Lighthouse release validation

  lighthouse:
    needs: release-validation
    if: needs.release-validation.outputs.is_release != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install social-card renderer browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        # LHCI's SEO audit grades crawlable output (robots meta "index", a valid
        # robots.txt, a sitemap). The build's fail-safe default is noindex, so
        # the production build type must be set here or the SEO category can
        # never reach 1.0. PUBLIC_BASE_URL mirrors what production serves.
        run: pnpm build
        env:
          PUBLIC_BUILD_TYPE: Production
          PUBLIC_BASE_URL: https://masrexach.com

      - name: Lighthouse CI (mobile emulation)
        # Use the audited lockfile, including the patched Lighthouse engine.
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            pnpm lighthouse
          else
            pnpm exec lhci autorun --config=lighthouse-routine.cjs
          fi
        env:
          EVENT_NAME: ${{ github.event_name }}

      - name: Internal link check (non-blocking)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        # fail: false covers broken links, not action setup/download failures.
        continue-on-error: true
        with:
          # base must be the site docroot (dist/client) so root-relative links
          # like /ca/ resolve to real files instead of reporting false 404s.
          args: --offline --base ./dist/client 'dist/client/**/*.html'
          fail: false
