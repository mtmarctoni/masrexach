name: Lighthouse

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-validation:
    uses: ./.github/workflows/release-validation.yml
    with:
      check_name: Lighthouse release validation

  lighthouse:
    needs: release-validation
    if: needs.release-validation.outputs.is_release != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install social-card renderer browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        # LHCI's SEO audit grades crawlable output (robots meta "index", a valid
        # robots.txt, a sitemap). The build's fail-safe default is noindex, so
        # the production build type must be set here or the SEO category can
        # never reach 1.0. PUBLIC_BASE_URL mirrors what production serves.
        run: pnpm build
        env:
          PUBLIC_BUILD_TYPE: Production
          PUBLIC_BASE_URL: https://masrexach.com

      - name: Lighthouse CI (mobile emulation)
        # Use the audited lockfile, including the patched Lighthouse engine.
        run: pnpm lighthouse

      - name: Internal link check (non-blocking)
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          # base must be the site docroot (dist/client) so root-relative links
          # like /ca/ resolve to real files instead of reporting false 404s.
          args: --offline --base ./dist/client 'dist/client/**/*.html'
          fail: false
