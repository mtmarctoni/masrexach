name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read # gitleaks lists PR commits to scan just the new ones

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-validation:
    uses: ./.github/workflows/release-validation.yml

  quality:
    needs: release-validation
    if: needs.release-validation.outputs.is_release != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install social-card renderer browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Vulnerability scan (osv-scanner)
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --lockfile=./pnpm-lock.yaml
            --config=osv-scanner.toml

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and format (Biome)
        run: pnpm exec biome ci .

      - name: Typecheck (astro check)
        run: pnpm check

      - name: Unit tests (Vitest)
        run: pnpm test

      - name: Unused files, exports and dependencies (Knip)
        run: pnpm knip

      - name: Dependency rules (dependency-cruiser)
        run: pnpm depcruise

      - name: Build
        run: pnpm build
        env:
          PUBLIC_BUILD_TYPE: Production
          PUBLIC_BASE_URL: https://masrexach.com

      - name: Built Worker integration and production smoke tests
        run: pnpm test:worker

      - name: Verify built production sharing cards
        run: pnpm test:og

      - name: Build and verify staging Worker
        run: pnpm build && pnpm test:worker && pnpm test:og
        env:
          CLOUDFLARE_ENV: staging
          PUBLIC_BUILD_TYPE: Staging
          PUBLIC_BASE_URL: https://masrexach-staging.marctonimas.com
