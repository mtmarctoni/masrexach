# 2026-08-15: single-package repo. pnpm 11 reads overrides and build
# approvals here (package.json "pnpm" field is no longer read).
#
# overrides — dev-only transitive deps of @lhci/cli: tmp < 0.2.4
# (GHSA-52f5-9888-hmc6, GHSA-ph9p-34f9-6g65) and uuid < 11.1.1
# (GHSA-w5hq-g745-h8pq).
#
# 2026-10-24: qs < 6.16.0 (GHSA-4mjr-xmp4-gh2g, GHSA-x5fp-wj9c-mxmx), pinned by
# express via @lhci/cli; undici 7 < 7.30.1 (GHSA-xjj6-f33q-929c,
# GHSA-4qv8-2p9j-2685, GHSA-f72v-6w45-q472), pinned exactly by miniflare via
# wrangler and @cloudflare/vite-plugin. Both dev/build-only.
overrides:
  # 2026-11-06: fix glob cancellation bypass (GHSA-3g3m-2fjr-6pw4)
  # and minimatch pattern amplification (GHSA-g3hv-75wg-m249) in
  # Astro Doctor / ESLint. Leave LHCI's unaffected legacy majors alone.
  glob@13: ^14.0.2
  minimatch@10: ^11.0.1
  tmp: ^0.2.6
  uuid: ^11.1.1
  qs: ^6.16.1
  undici@7: ^7.30.1
  # Lighthouse CI 0.15.1 pins Lighthouse 12.6.1. Lighthouse 13 brings
  # Puppeteer 25 / browsers 3 (no extract-zip) and chromium-bidi using Zod 4.
  # Keep both LHCI consumers on the same tested engine until LHCI updates.
  lighthouse@12.6.1: ^13.5.0
  # get-uri still requests basic-ftp 5; 6 preserves its CommonJS Client API
  # and fixes GHSA-c475-qrg2-pj4r (>=6.2.1).
  get-uri>basic-ftp: ^6.2.3
  # browsers 3 optionally peers on proxy-agent >=8.0.1; LHCI uses the same
  # ProxyAgent constructor (require(ESM) is supported by our Node floor).
  "@lhci/cli>proxy-agent": ^8.0.1
  # Sentry's OpenTelemetry SDK 2.12 peers require API <1.10.0.
  "@opentelemetry/api": 1.9.0

allowBuilds:
  esbuild: true
  simple-git-hooks: true
  workerd: true
